<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senin İçin ❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}

body{
  overflow:hidden;
  background:#0f0f1a;
  color:white;
}

/* Sayfalar */
.page{
  position:absolute;
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
  transition:1s;
}

/* Sayfa 1 */
#page1{
  background:radial-gradient(circle,#1a1a2e,#0f0f1a);
}

/* Sayfa 2 */
#page2{
  background:linear-gradient(135deg,#e63946,#ff758f);
  transform:translateX(100%);
}

/* Buton */
button{
  margin-top:25px;
  padding:12px 25px;
  border:none;
  border-radius:30px;
  font-size:16px;
  cursor:pointer;
  background:white;
  color:#e63946;
  font-weight:bold;
  transition:0.3s;
}
button:hover{
  transform:scale(1.1);
}

/* Kalp animasyonu */
.heart{
  position:absolute;
  color:#ff4d6d;
  animation:float 6s linear infinite;
}
@keyframes float{
  0%{transform:translateY(100vh);opacity:1;}
  100%{transform:translateY(-10vh);opacity:0;}
}
</style>
</head>

<body>

<!-- SAYFA 1 -->
<div class="page" id="page1">
  <h1>Bir şey söylemem lazım... ❤️</h1>
  <p style="margin-top:15px;font-size:18px;opacity:0.8;">
    Hazır mısın?
  </p>
  <button onclick="nextPage()">Devam Et 💌</button>
</div>

<!-- SAYFA 2 -->
<div class="page" id="page2">
  <h1>Sevgililer Günümüz Kutlu Olsun 💖</h1>
  <p style="margin-top:20px;font-size:18px;max-width:350px;">
    Hayatıma girdiğin günden beri her şey daha anlamlı.  
    Gülüşün huzurum, varlığın mutluluğum oldu.  
    İyi ki varsın, iyi ki benimlesin.  
    Seni her gün, her an, daha çok seviyorum. ❤️
  </p>
  <button onclick="prevPage()">Geri Dön 💕</button>
</div>

<script>
function nextPage(){
  document.getElementById("page1").style.transform="translateX(-100%)";
  document.getElementById("page2").style.transform="translateX(0)";
}

function prevPage(){
  document.getElementById("page1").style.transform="translateX(0)";
  document.getElementById("page2").style.transform="translateX(100%)";
}

/* Uçuşan kalpler */
function createHeart(){
  const heart=document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML="❤️";
  heart.style.left=Math.random()*100+"vw";
  heart.style.fontSize=(15+Math.random()*25)+"px";
  heart.style.animationDuration=(4+Math.random()*3)+"s";
  document.body.appendChild(heart);
  setTimeout(()=>{heart.remove();},6000);
}
setInterval(createHeart,500);
</script>

</body>
</html>
