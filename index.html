<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senin İçin ❤️</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle at top,#1a1a2e,#0f0f1a);
  font-family:'Segoe UI',sans-serif;
  overflow:hidden;
}

/* Uçuşan kalpler */
.heart{
  position:absolute;
  color:#ff4d6d;
  animation:float 6s linear infinite;
  font-size:20px;
}
@keyframes float{
  0%{transform:translateY(100vh) scale(1);opacity:1;}
  100%{transform:translateY(-10vh) scale(1.5);opacity:0;}
}

/* Zarf */
.envelope{
  position:relative;
  width:320px;
  height:220px;
  background:#e63946;
  border-radius:10px;
  cursor:pointer;
  box-shadow:0 20px 40px rgba(0,0,0,0.6);
  transition:0.6s;
}

.flap{
  position:absolute;
  width:100%;
  height:100%;
  background:#c1121f;
  clip-path:polygon(0 0,50% 60%,100% 0);
  transform-origin:top;
  transition:0.6s;
  border-radius:10px;
}

.letter{
  position:absolute;
  width:90%;
  height:90%;
  background:white;
  top:5%;
  left:5%;
  border-radius:10px;
  padding:15px;
  box-sizing:border-box;
  text-align:center;
  transform:translateY(100%);
  transition:0.6s;
  overflow:auto;
}

.letter h2{
  color:#e63946;
  margin-top:10px;
}

.letter p{
  font-size:15px;
  line-height:1.5;
  color:#333;
}

.open .flap{
  transform:rotateX(180deg);
}

.open .letter{
  transform:translateY(0);
}
</style>
</head>

<body>

<div class="envelope" onclick="this.classList.toggle('open')">
  <div class="flap"></div>
  <div class="letter">
    <h2>Sevgililer Günümüz Kutlu Olsun ❤️</h2>
    <p>
      Hayatımın en güzel tesadüfü…<br><br>
      Seninle geçen her an, kalbimde ayrı bir iz bırakıyor.  
      Gülüşün dünyamı aydınlatıyor, sesin huzur veriyor.  
      İyi ki varsın, iyi ki benimlesin.  
      Seni bugün değil, her gün seviyorum. 💕
    </p>
  </div>
</div>

<script>
function createHeart(){
  const heart=document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML="❤️";
  heart.style.left=Math.random()*100+"vw";
  heart.style.fontSize=(15+Math.random()*25)+"px";
  heart.style.animationDuration=(4+Math.random()*3)+"s";
  document.body.appendChild(heart);
  setTimeout(()=>{heart.remove();},6000);
}
setInterval(createHeart,400);
</script>

</body>
</html>
